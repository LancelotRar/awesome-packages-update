name: audit-assets

# 每周检查一次：每个 watch item 的资产过滤是否还能命中当前 release。
# 上游改名/换格式时，这条会在投递前失败，而不是退化成纯文字通知；
# 有失败时把具体条目推到 TG_CHAT_ID_ADMIN。

on:
  schedule:
    - cron: '0 11 * * 1'  # 每周一 11:00（UTC+8）
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 重跑时跟随分支最新提交，避免用旧的 projects.yaml 做一次过期审计。
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Audit asset filters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN_03BOT }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHAT_ID_ADMIN: ${{ secrets.TG_CHAT_ID_ADMIN }}
        run: python3 scripts/audit_assets.py
